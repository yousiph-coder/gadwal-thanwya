<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المنهج — منشئ الجدول الدراسي</title>
<meta name="description" content="إدارة منهج الثانوية العامة - تتبع الوحدات والدروس والتقدم الدراسي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* ── Curriculum Page Specific ── */
.curriculum-page { gap: 0; max-width: 960px; margin: 0 auto; width: 100%; padding-top: 30px; flex-direction: column; }
.curr-header-bar {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding-bottom: 14px; border-bottom: 1px solid var(--glass-border);
  margin-bottom: 24px; flex-wrap: wrap;
}
.curr-title { font-size: 1.4rem; font-weight: 800; flex: 1; }
.curr-breadcrumb {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: .82rem; color: var(--text-dim); padding: 10px 16px;
  border-radius: 12px; background: rgba(255,255,255,.04);
  border: 1px solid var(--glass-border); width: 100%;
  margin-bottom: 16px; min-height: 40px;
}
.curr-crumb { cursor: pointer; transition: color .2s; padding: 2px 4px; border-radius: 6px; }
.curr-crumb:hover { color: var(--text); background: rgba(255,255,255,.08); }
.curr-crumb.active { color: var(--text); font-weight: 700; cursor: default; }
.curr-crumb.active:hover { background: transparent; }
.curr-crumb-sep { opacity: .4; }

/* Stats bar */
.curr-stats-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px; width: 100%; margin-bottom: 24px;
}
.curr-stat-card {
  padding: 16px; text-align: center; border-radius: 16px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  backdrop-filter: blur(12px);
}
.curr-stat-num { font-size: 1.8rem; font-weight: 900; margin-bottom: 4px; }
.curr-stat-lbl { font-size: .75rem; color: var(--text-dim); }

/* Level views */
.curr-view { display: none; flex-direction: column; gap: 14px; width: 100%; animation: fadeInUp .35s ease forwards; }
.curr-view.active { display: flex; }

/* Subject cards grid */
.curr-subjects-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px; width: 100%;
}
.curr-subject-card {
  padding: 24px 18px; border-radius: 18px;
  border: 1px solid var(--glass-border); border-right: 4px solid transparent;
  background: var(--glass-bg); backdrop-filter: blur(12px);
  cursor: pointer; transition: all .3s;
  text-align: center; position: relative; overflow: hidden;
  animation: fadeInUp .5s ease forwards; opacity: 0;
}
.curr-subject-card::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg,rgba(255,255,255,.1) 0%,transparent 60%);
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
.curr-subject-card:hover::after { opacity: 1; }
.curr-subject-card:hover { transform: translateY(-5px); box-shadow: 0 14px 36px rgba(0,0,0,.35); }
.curr-subject-card .cs-icon { font-size: 2.4rem; margin-bottom: 10px; display: block; filter: drop-shadow(0 0 8px currentColor); }
.curr-subject-card .cs-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; }
.curr-subject-card .cs-prog-text { font-size: .72rem; color: var(--text-dim); margin-bottom: 8px; }
.curr-subject-card .cs-prog-bar { width: 100%; height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
body.day-mode .curr-subject-card .cs-prog-bar { background: rgba(0,0,0,.1); }
.curr-subject-card .cs-prog-fill { height: 100%; border-radius: 3px; transition: width .3s ease; }
.cs-done-badge { position: absolute; top: 10px; left: 10px; font-size: 1.1rem; }

/* Units list */
.curr-units-list { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.curr-unit-card {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; border-radius: 14px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  backdrop-filter: blur(12px); cursor: pointer;
  transition: all .25s; position: relative; overflow: hidden;
  animation: fadeInUp .4s ease forwards; opacity: 0;
}
.curr-unit-card:hover { transform: translateX(-5px); background: rgba(255,255,255,.1); }
body.day-mode .curr-unit-card:hover { background: rgba(0,0,0,.05); }
.curr-unit-card .cu-num {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem; font-weight: 800; flex-shrink: 0;
  background: rgba(255,255,255,.08); border: 1px solid var(--glass-border);
}
.curr-unit-card .cu-info { flex: 1; text-align: right; }
.curr-unit-card .cu-name { font-size: .95rem; font-weight: 700; margin-bottom: 4px; }
.curr-unit-card .cu-meta { font-size: .72rem; color: var(--text-dim); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.curr-unit-card .cu-prog-bar { width: 100%; height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; margin-top: 6px; }
body.day-mode .curr-unit-card .cu-prog-bar { background: rgba(0,0,0,.08); }
.curr-unit-card .cu-prog-fill { height: 100%; background: linear-gradient(90deg,#a855f7,#7c3aed); border-radius: 2px; transition: width .3s; }
.curr-unit-card .cu-arrow { color: var(--text-dim); font-size: 1.1rem; transition: transform .2s; flex-shrink: 0; }
.curr-unit-card:hover .cu-arrow { transform: translateX(-4px); }
.curr-unit-delete {
  background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25);
  color: #ef4444; border-radius: 8px; padding: 5px 10px;
  font-size: .72rem; cursor: pointer; font-family: 'Cairo', sans-serif;
  transition: all .2s; flex-shrink: 0; white-space: nowrap;
}
.curr-unit-delete:hover { background: rgba(239,68,68,.3); }

/* Lessons list */
.curr-lessons-list { display: flex; flex-direction: column; gap: 9px; width: 100%; }
.curr-lesson-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border-radius: 13px;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
  transition: all .2s; animation: fadeInUp .3s ease forwards; opacity: 0;
}
body.day-mode .curr-lesson-item { background: rgba(0,0,0,.02); border-color: rgba(0,0,0,.08); }
.curr-lesson-item:hover { background: rgba(255,255,255,.08); }
body.day-mode .curr-lesson-item:hover { background: rgba(0,0,0,.05); }
.curr-lesson-item.completed { opacity: .6; }
.curr-lesson-item.completed .cl-text { text-decoration: line-through; color: var(--text-dim); }
.cl-check {
  width: 22px; height: 22px; border: 2px solid rgba(255,255,255,.3);
  border-radius: 5px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; transition: all .2s;
  font-size: .8rem;
}
.cl-check:hover { border-color: #22c55e; }
.cl-check.done { background: #22c55e; border-color: #22c55e; color: #fff; }
body.day-mode .cl-check { border-color: rgba(0,0,0,.25); }
.cl-text { flex: 1; font-size: .92rem; line-height: 1.5; }
.cl-num { font-size: .7rem; color: var(--text-dim); background: rgba(255,255,255,.07); padding: 2px 8px; border-radius: 8px; flex-shrink: 0; }
.cl-del {
  background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25);
  color: #ef4444; border-radius: 7px; padding: 4px 9px;
  font-size: .72rem; cursor: pointer; font-family: 'Cairo', sans-serif;
  transition: all .2s; opacity: 0; flex-shrink: 0;
}
.curr-lesson-item:hover .cl-del { opacity: 1; }
.cl-del:hover { background: rgba(239,68,68,.3); }

/* Add buttons */
.curr-add-row {
  display: flex; gap: 10px; width: 100%; margin-top: 4px; flex-wrap: wrap;
}
.curr-add-input {
  flex: 1; min-width: 160px; background: rgba(0,0,0,.25);
  border: 1px solid var(--glass-border); color: var(--text);
  border-radius: 12px; padding: 10px 15px; font-size: .9rem;
  font-family: 'Cairo', sans-serif; outline: none; transition: border-color .2s;
}
.curr-add-input:focus { border-color: rgba(255,255,255,.35); }
.curr-add-input::placeholder { color: var(--text-dim); }
body.day-mode .curr-add-input { background: rgba(0,0,0,.05); }
.curr-add-btn {
  padding: 10px 20px; border-radius: 12px; border: none;
  background: linear-gradient(135deg,#3b6ef8,#8b5cf6);
  color: #fff; font-weight: 700; font-size: .85rem;
  font-family: 'Cairo', sans-serif; cursor: pointer;
  transition: all .2s; white-space: nowrap;
}
.curr-add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(59,110,248,.35); }

/* Back button */
.curr-back-btn {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.07); border: 1px solid var(--glass-border);
  color: var(--text-dim); border-radius: 12px; padding: 8px 16px;
  font-size: .85rem; font-family: 'Cairo', sans-serif;
  cursor: pointer; transition: all .2s; flex-shrink: 0;
}
.curr-back-btn:hover { background: rgba(255,255,255,.14); color: var(--text); }

/* Empty state */
.curr-empty {
  text-align: center; padding: 60px 20px; color: var(--text-dim);
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-radius: 20px; backdrop-filter: blur(12px); width: 100%;
}
.curr-empty-icon { font-size: 3.5rem; display: block; margin-bottom: 16px; }
.curr-empty-text { font-size: 1rem; line-height: 1.6; }

/* Unit name edit */
.cu-name-input {
  background: transparent; border: none; color: var(--text);
  font-weight: 700; font-size: .95rem; outline: none;
  border-bottom: 1px solid rgba(255,255,255,.2); padding: 2px 4px;
  font-family: 'Cairo', sans-serif; width: 100%; text-align: right;
  transition: border-color .2s;
}
.cu-name-input:focus { border-bottom-color: rgba(255,255,255,.6); }
body.day-mode .cu-name-input { border-bottom-color: rgba(0,0,0,.2); color: #1e293b; }
body.day-mode .cu-name-input:focus { border-bottom-color: rgba(0,0,0,.5); }

@media(max-width:600px) {
  .curr-subjects-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .curr-subject-card { padding: 18px 12px; }
  .curr-stats-bar { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="screen has-nav active fade-in curriculum-page" id="screenCurriculum" style="display:flex;">
  <!-- Breadcrumb -->
  <div class="curr-breadcrumb" id="currBreadcrumb" aria-label="مسار التنقل">
    <span class="curr-crumb active" id="crumbRoot" onclick="goToLevel('subjects')">📚 المنهج</span>
  </div>

  <!-- Header bar -->
  <div class="curr-header-bar">
    <div class="curr-title" id="currTitle">إدارة المنهج</div>
    <div id="currHeaderActions"></div>
  </div>

  <!-- Stats bar (visible on subjects level) -->
  <div class="curr-stats-bar" id="currStatsBar"></div>

  <!-- LEVEL 1: Subjects View -->
  <div class="curr-view active" id="viewSubjects">
    <div class="curr-subjects-grid" id="subjectsGrid"></div>
  </div>

  <!-- LEVEL 2: Units View -->
  <div class="curr-view" id="viewUnits">
    <div class="curr-units-list" id="unitsList"></div>
    <div class="curr-add-row" id="addUnitRow">
      <input type="text" class="curr-add-input" id="newUnitInput" placeholder="اسم الوحدة الجديدة...">
      <button class="curr-add-btn" id="addUnitBtn" onclick="doAddUnit()">+ إضافة وحدة</button>
    </div>
  </div>

  <!-- LEVEL 3: Lessons View -->
  <div class="curr-view" id="viewLessons">
    <div class="curr-lessons-list" id="lessonsList"></div>
    <div class="curr-add-row" id="addLessonRow">
      <input type="text" class="curr-add-input" id="newLessonInput" placeholder="اسم الدرس الجديد...">
      <button class="curr-add-btn" id="addLessonBtn" onclick="doAddLesson()">+ إضافة درس</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/particles.js"></script>
<script src="js/db.js"></script>
<script src="js/supabase.js"></script>
<script src="js/common.js?v=4.3"></script>
<script>
// ── State ──
let currLevel = 'subjects'; // 'subjects' | 'units' | 'lessons'
let currSubjectIdx = -1;
let currUnitIdx = -1;

// ── Init ──
window.appReady.then(() => {
  initCurriculumPage();
});

function initCurriculumPage() {
  // Initialize curriculum state if branch is set but no subjects yet
  if (state.branch && !curriculumState.subjects.length) {
    const br = BRANCHES[state.branch];
    curriculumState.subjects = br.subjects.map((name, i) => ({
      id: i,
      name,
      color: COLORS[i % COLORS.length],
      units: []
    }));
    saveCurrentData();
  }
  goToLevel('subjects');
}

// ── Navigation ──
function goToLevel(level, si, ui) {
  currLevel = level;
  // Hide all views
  document.querySelectorAll('.curr-view').forEach(v => v.classList.remove('active'));
  document.getElementById('currStatsBar').style.display = '';

  if (level === 'subjects') {
    currSubjectIdx = -1;
    currUnitIdx = -1;
    document.getElementById('viewSubjects').classList.add('active');
    document.getElementById('currTitle').textContent = 'إدارة المنهج';
    document.getElementById('currHeaderActions').innerHTML = '';
    renderBreadcrumb();
    renderStatsBar();
    renderSubjects();

  } else if (level === 'units') {
    currSubjectIdx = si;
    currUnitIdx = -1;
    document.getElementById('viewUnits').classList.add('active');
    document.getElementById('currStatsBar').style.display = 'none';
    const subj = curriculumState.subjects[si];
    document.getElementById('currTitle').textContent = `${SUBJECT_ICONS[subj.name] || '📖'} ${subj.name}`;
    document.getElementById('currHeaderActions').innerHTML = `
      <button class="curr-back-btn" onclick="goToLevel('subjects')">← رجوع</button>`;
    renderBreadcrumb();
    renderUnits(si);

  } else if (level === 'lessons') {
    currSubjectIdx = si;
    currUnitIdx = ui;
    document.getElementById('viewLessons').classList.add('active');
    document.getElementById('currStatsBar').style.display = 'none';
    const unit = curriculumState.subjects[si].units[ui];
    document.getElementById('currTitle').textContent = `📋 ${unit.name}`;
    document.getElementById('currHeaderActions').innerHTML = `
      <button class="curr-back-btn" onclick="goToLevel('units', ${si})">← رجوع</button>`;
    renderBreadcrumb();
    renderLessons(si, ui);
  }
}

// ── Breadcrumb ──
function renderBreadcrumb() {
  const bc = document.getElementById('currBreadcrumb');
  let html = `<span class="curr-crumb ${currLevel==='subjects'?'active':''}" onclick="goToLevel('subjects')">📚 المنهج</span>`;
  if (currSubjectIdx >= 0) {
    const subj = curriculumState.subjects[currSubjectIdx];
    html += `<span class="curr-crumb-sep">›</span>
             <span class="curr-crumb ${currLevel==='units'?'active':''}" 
                   onclick="goToLevel('units',${currSubjectIdx})">${SUBJECT_ICONS[subj.name]||'📖'} ${subj.name}</span>`;
  }
  if (currUnitIdx >= 0) {
    const unit = curriculumState.subjects[currSubjectIdx].units[currUnitIdx];
    html += `<span class="curr-crumb-sep">›</span>
             <span class="curr-crumb active">📋 ${unit.name}</span>`;
  }
  bc.innerHTML = html;
}

// ── Stats bar ──
function renderStatsBar() {
  const statsBar = document.getElementById('currStatsBar');
  let totalUnits = 0, totalLessons = 0, completedLessons = 0, reviewedLessons = 0;
  curriculumState.subjects.forEach(s => {
    totalUnits += s.units.length;
    s.units.forEach(u => {
      totalLessons += u.lessons.length;
      completedLessons += u.lessons.filter(l => l.completed).length;
      reviewedLessons += u.lessons.filter(l => l.reviewed).length;
    });
  });
  const overallPct = totalLessons ? Math.round(completedLessons/totalLessons*100) : 0;
  statsBar.innerHTML = `
    <div class="curr-stat-card">
      <div class="curr-stat-num" style="color:#3b82f6">${curriculumState.subjects.length}</div>
      <div class="curr-stat-lbl">مادة دراسية</div>
    </div>
    <div class="curr-stat-card">
      <div class="curr-stat-num" style="color:#a855f7">${totalUnits}</div>
      <div class="curr-stat-lbl">وحدة</div>
    </div>
    <div class="curr-stat-card">
      <div class="curr-stat-num" style="color:#22c55e">${completedLessons}<span style="font-size:1rem;font-weight:600;color:var(--text-dim)">/${totalLessons}</span></div>
      <div class="curr-stat-lbl">دروس مكتملة</div>
    </div>
    <div class="curr-stat-card">
      <div class="curr-stat-num" style="color:#ec4899">${overallPct}%</div>
      <div class="curr-stat-lbl">إجمالي التقدم</div>
    </div>`;
}

// ── Level 1: Subjects ──
function renderSubjects() {
  const grid = document.getElementById('subjectsGrid');

  if (!curriculumState.subjects.length) {
    grid.innerHTML = `<div class="curr-empty" style="grid-column:1/-1">
      <span class="curr-empty-icon">📚</span>
      <div class="curr-empty-text">اختر شعبتك من الجدول الدراسي أولاً<br><small style="color:var(--text-dim)">المنهج يتزامن مع شعبتك تلقائياً</small></div>
    </div>`;
    return;
  }

  grid.innerHTML = '';
  curriculumState.subjects.forEach((subj, si) => {
    const prog = calcSubjectProg(subj);
    const isComplete = prog === 100 && subj.units.length > 0;
    const card = document.createElement('div');
    card.className = 'curr-subject-card glass';
    card.style.cssText = `border-right-color:${subj.color};animation-delay:${si*60}ms`;
    card.onclick = () => goToLevel('units', si);
    card.innerHTML = `
      ${isComplete ? '<span class="cs-done-badge">✅</span>' : ''}
      <span class="cs-icon">${SUBJECT_ICONS[subj.name] || '📖'}</span>
      <div class="cs-name">${subj.name}</div>
      <div class="cs-prog-text">${prog}% مكتمل · ${subj.units.length} وحدة</div>
      <div class="cs-prog-bar">
        <div class="cs-prog-fill" style="width:${prog}%;background:linear-gradient(90deg,${subj.color}88,${subj.color})"></div>
      </div>`;
    grid.appendChild(card);
  });
}

// ── Level 2: Units ──
function renderUnits(si) {
  const list = document.getElementById('unitsList');
  const subj = curriculumState.subjects[si];
  list.innerHTML = '';

  if (!subj.units.length) {
    list.innerHTML = `<div class="curr-empty">
      <span class="curr-empty-icon">📦</span>
      <div class="curr-empty-text">لا توجد وحدات بعد<br><small>اضغط على "+ إضافة وحدة" لإضافة أول وحدة</small></div>
    </div>`;
  } else {
    subj.units.forEach((unit, ui) => {
      const prog = calcUnitProg(unit);
      const isComplete = prog === 100 && unit.lessons.length > 0;
      const card = document.createElement('div');
      card.className = 'curr-unit-card glass';
      card.style.animationDelay = (ui * 50) + 'ms';
      card.innerHTML = `
        <div class="cu-num" style="color:${subj.color};border-color:${subj.color}44;background:${subj.color}11">${ui+1}</div>
        <div class="cu-info">
          <div class="cu-name">
            <input class="cu-name-input" type="text" value="${escH(unit.name)}" 
              onclick="event.stopPropagation()"
              onchange="updateUnitName(${si},${ui},this.value)">
          </div>
          <div class="cu-meta">
            <span>${unit.lessons.length} درس</span>
            <span>·</span>
            <span>${unit.lessons.filter(l=>l.completed).length} مكتمل</span>
            ${isComplete ? '<span>· ✅ مكتمل</span>' : ''}
          </div>
          <div class="cu-prog-bar">
            <div class="cu-prog-fill" style="width:${prog}%;background:linear-gradient(90deg,${subj.color}88,${subj.color})"></div>
          </div>
        </div>
        <button class="curr-unit-delete" onclick="event.stopPropagation();removeUnit(${si},${ui})">🗑</button>
        <span class="cu-arrow">‹</span>`;
      card.addEventListener('click', (e) => {
        if (!e.target.closest('.curr-unit-delete') && !e.target.closest('.cu-name-input')) {
          goToLevel('lessons', si, ui);
        }
      });
      list.appendChild(card);
    });
  }

  // Reset input
  document.getElementById('newUnitInput').value = '';
}

// ── Level 3: Lessons ──
function renderLessons(si, ui) {
  const list = document.getElementById('lessonsList');
  const unit = curriculumState.subjects[si].units[ui];
  const subj = curriculumState.subjects[si];
  list.innerHTML = '';

  if (!unit.lessons.length) {
    list.innerHTML = `<div class="curr-empty">
      <span class="curr-empty-icon">📝</span>
      <div class="curr-empty-text">لا توجد دروس بعد<br><small>اضغط على "+ إضافة درس" لإضافة أول درس</small></div>
    </div>`;
  } else {
    unit.lessons.forEach((lesson, li) => {
      const item = document.createElement('div');
      item.className = `curr-lesson-item${lesson.completed ? ' completed' : ''}`;
      item.style.animationDelay = (li * 40) + 'ms';
      item.innerHTML = `
        <div class="cl-check ${lesson.completed ? 'done' : ''}" 
             onclick="toggleLesson(${si},${ui},${li})" title="${lesson.completed ? 'إلغاء' : 'تحديد كمكتمل'}">
          ${lesson.completed ? '✓' : ''}
        </div>
        <span class="cl-text">${escH(lesson.name)}</span>
        <span class="cl-num">درس ${li+1}</span>
        <button class="cl-del" onclick="removeLesson(${si},${ui},${li})">حذف</button>`;
      list.appendChild(item);
    });
  }

  document.getElementById('newLessonInput').value = '';
}

// ── CRUD Operations ──
function doAddUnit() {
  const input = document.getElementById('newUnitInput');
  const name = input.value.trim();
  if (!name) { input.focus(); showToast('⚠️ أدخل اسم الوحدة'); return; }
  curriculumState.subjects[currSubjectIdx].units.push({ name, lessons: [] });
  saveCurrentData();
  renderUnits(currSubjectIdx);
  renderStatsBar();
  showToast('✅ تمت إضافة الوحدة', 'success');
}

function removeUnit(si, ui) {
  if (!confirm('هل أنت متأكد من حذف هذه الوحدة وجميع دروسها؟')) return;
  curriculumState.subjects[si].units.splice(ui, 1);
  saveCurrentData();
  renderUnits(si);
  renderStatsBar();
}

function updateUnitName(si, ui, newName) {
  if (!newName.trim()) return;
  curriculumState.subjects[si].units[ui].name = newName.trim();
  saveCurrentData();
  renderBreadcrumb();
}

function doAddLesson() {
  const input = document.getElementById('newLessonInput');
  const name = input.value.trim();
  if (!name) { input.focus(); showToast('⚠️ أدخل اسم الدرس'); return; }
  curriculumState.subjects[currSubjectIdx].units[currUnitIdx].lessons.push({
    name, completed: false, reviewed: false
  });
  saveCurrentData();
  renderLessons(currSubjectIdx, currUnitIdx);
  showToast('✅ تمت إضافة الدرس', 'success');
}

function removeLesson(si, ui, li) {
  if (!confirm('هل أنت متأكد من حذف هذا الدرس؟')) return;
  curriculumState.subjects[si].units[ui].lessons.splice(li, 1);
  saveCurrentData();
  renderLessons(si, ui);
}

function toggleLesson(si, ui, li) {
  const lesson = curriculumState.subjects[si].units[ui].lessons[li];
  lesson.completed = !lesson.completed;
  if (!lesson.completed) lesson.reviewed = false;
  saveCurrentData();
  renderLessons(si, ui);
  const unit = curriculumState.subjects[si].units[ui];
  const prog = calcUnitProg(unit);
  if (prog === 100 && unit.lessons.length > 0) {
    showToast('🎉 أحسنت! اكتملت جميع دروس الوحدة', 'success');
  }
}

// ── Progress Calculations ──
function calcSubjectProg(subj) {
  if (!subj.units.length) return 0;
  let total = 0, comp = 0;
  subj.units.forEach(u => { total += u.lessons.length; comp += u.lessons.filter(l => l.completed).length; });
  return total ? Math.round(comp/total*100) : 0;
}

function calcUnitProg(unit) {
  if (!unit.lessons.length) return 0;
  return Math.round(unit.lessons.filter(l => l.completed).length / unit.lessons.length * 100);
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (currLevel === 'units' && document.getElementById('newUnitInput') === document.activeElement) {
      doAddUnit();
    } else if (currLevel === 'lessons' && document.getElementById('newLessonInput') === document.activeElement) {
      doAddLesson();
    }
  }
  if (e.key === 'Escape' && currLevel !== 'subjects') {
    if (currLevel === 'lessons') goToLevel('units', currSubjectIdx);
    else goToLevel('subjects');
  }
});
</script>
