name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔄 Sync Capacitor Assets
        run: npx cap sync android

      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🏗️ Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gadwal-thanwy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Release (on push to main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "📱 الجدول الدراسي — v${{ github.run_number }}"
          body: |
            ## 📱 تطبيق الجدول الدراسي — ثانوية عامة
            
            ### 📥 طريقة التثبيت:
            1. حمّل ملف `app-debug.apk` من الأسفل
            2. افتح **الإعدادات** في هاتفك
            3. اذهب لـ **الأمان** → **مصادر غير معروفة** → فعّلها
            4. افتح ملف الـ APK وثبّته
            
            ### ⚠️ ملاحظة:
            هذا إصدار تجريبي (Debug). للإصدار الرسمي على Google Play يحتاج توقيع رسمي.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
