<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهام اليوم — منشئ الجدول الدراسي</title>
<meta name="description" content="إدارة وتتبع المهام الدراسية اليومية التلقائية واليدوية لطلاب الثانوية العامة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* Page Specific Styles */
.todo-page { gap: 20px; max-width: 760px; margin: 0 auto; width: 100%; padding-top: 30px; flex-direction: column; }
.todo-date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 12px 18px;
  border-radius: 16px;
}
.todo-date-arrow {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--glass-border);
  color: var(--text);
  border-radius: 50%;
  width: 38px;
  height: 38px;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.todo-date-arrow:hover {
  background: rgba(255, 255, 255, 0.16);
}
.todo-date-display-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.todo-date-display {
  font-size: 1.05rem;
  font-weight: 700;
}
.todo-today-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--glass-border);
  color: var(--text-dim);
  border-radius: 10px;
  padding: 5px 12px;
  font-size: 0.78rem;
  font-family: 'Cairo', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.todo-today-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  color: var(--text);
}
.todo-item-icon {
  font-size: 1.1rem;
  margin-left: 6px;
  display: flex;
  align-items: center;
}
.todo-archive-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--glass-border);
  color: var(--text);
  border-radius: 12px;
  padding: 8px 14px;
  font-size: 0.82rem;
  font-family: 'Cairo', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.todo-archive-btn:hover {
  background: rgba(255, 255, 255, 0.15);
}
.todo-stats {
  font-size: 0.82rem;
  color: var(--text-dim);
  background: rgba(255, 255, 255, 0.05);
  padding: 4px 12px;
  border-radius: 10px;
  border: 1px solid var(--glass-border);
}
.todo-progress {
  height: 12px;
  border-radius: 8px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--glass-border);
  position: relative;
  width: 100%;
}
.todo-progress-bar {
  height: 100%;
  border-radius: 6px;
  background: linear-gradient(90deg, #22c55e, #14b8a6);
  width: 0%;
  transition: width 0.4s ease;
}
</style>
</head>
<body>

<div class="screen active fade-in todo-page" id="screenTodo" style="display: flex;">
  <div class="todo-header-bar">
    <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
      <span class="todo-title">✅ مهام اليوم</span>
      <span class="todo-stats" id="todoStats">0 / 0 مكتمل</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="todo-archive-btn" onclick="archiveCompletedTasks()" title="أرشفة المهام المكتملة السابقة">📦 أرشفة</button>
      <button class="todo-archive-btn" onclick="showArchive()" title="عرض الأرشيف">📂 الأرشيف</button>
    </div>
  </div>
  
  <!-- progress bar -->
  <div class="todo-progress">
    <div class="todo-progress-bar" id="todoProgressBar"></div>
  </div>
  
  <!-- date navigation -->
  <div class="todo-date-nav glass">
    <button class="todo-date-arrow" onclick="navigateDate(-1)" title="اليوم السابق">←</button>
    <div class="todo-date-display-wrap">
      <div class="todo-date-display" id="todoDateDisplay">—</div>
      <button class="todo-today-btn" onclick="jumpToToday()">اليوم</button>
    </div>
    <button class="todo-date-arrow" onclick="navigateDate(1)" title="اليوم التالي">→</button>
  </div>
  
  <!-- add task -->
  <div class="todo-add-box glass">
    <input type="text" class="todo-add-input" id="todoInput" placeholder="اكتب مهمة يدوية جديدة..." onkeydown="if(event.key==='Enter') addTodo()">
    <input type="date" class="todo-date-input" id="todoDateInput" onchange="onDatePickerChange(this.value)">
    <button class="todo-add-btn" onclick="addTodo()">＋</button>
  </div>
  
  <!-- filters -->
  <div class="todo-filter-bar">
    <button class="todo-filter-btn active" id="filterAll" onclick="setTodoFilter('all', this)">الكل</button>
    <button class="todo-filter-btn" id="filterPending" onclick="setTodoFilter('pending', this)">قيد التنفيذ</button>
    <button class="todo-filter-btn" id="filterDone" onclick="setTodoFilter('done', this)">مكتملة</button>
  </div>
  
  <!-- list -->
  <div class="todo-list" id="todoList"></div>
</div>

<!-- Modal Archive -->
<div class="modal-overlay" id="archiveModal">
  <div class="modal-box glass" style="max-width: 500px; width: 100%;">
    <div class="modal-header">
      <span class="modal-title">📂 أرشيف المهام المكتملة</span>
      <button class="modal-close" onclick="closeArchive()">✕</button>
    </div>
    <div class="modal-content" style="max-height: 400px; overflow-y: auto; padding: 15px 10px;">
      <div id="archiveList" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/particles.js"></script>
<script src="js/db.js"></script>
<script src="js/supabase.js"></script>
<script src="js/common.js?v=4.3"></script>
<script>
let currentSelectedDate = new Date();
let todoFilter = 'all';

function initTodoPage() {
  jumpToToday();
}

function updateDateDisplay() {
  const key = dateToKey(currentSelectedDate);
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('todoDateDisplay').textContent = currentSelectedDate.toLocaleDateString('ar-EG', options);
  document.getElementById('todoDateInput').value = key;
  renderTodoList();
}

function navigateDate(delta) {
  // standard calendar direction (since we are RTL, right is previous day and left is next day,
  // but to prevent confusion we use the arrows directly: delta -1 is yesterday, delta 1 is tomorrow)
  currentSelectedDate.setDate(currentSelectedDate.getDate() + delta);
  updateDateDisplay();
}

function jumpToToday() {
  currentSelectedDate = new Date();
  updateDateDisplay();
}

function onDatePickerChange(val) {
  if (!val) return;
  // Prevent timezone offset shifting issues by parsing YYYY-MM-DD correctly
  const parts = val.split('-').map(Number);
  currentSelectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
  updateDateDisplay();
}

function getArabicDayName(dateKey) {
  const d = new Date(dateKey);
  const dayIndex = d.getDay();
  // Mapping standard JS getDay() [0:Sun - 6:Sat] to our Arabic DAYS helper array index:
  // DAYS = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة']
  const mapping = {
    6: 'السبت',
    0: 'الأحد',
    1: 'الاثنين',
    2: 'الثلاثاء',
    3: 'الأربعاء',
    4: 'الخميس',
    5: 'الجمعة'
  };
  return mapping[dayIndex] || null;
}

function getAutoTasksForDate(dateKey) {
  const dayName = getArabicDayName(dateKey);
  if (!dayName) return [];
  
  const tasks = [];
  
  // 1. Class auto-tasks from state.subjects
  if (state.subjects) {
    state.subjects.forEach(subj => {
      if (subj.sessions) {
        subj.sessions.forEach(sess => {
          if (sess.days && sess.days.includes(dayName)) {
            const timeStr = sess.startTime ? ` (${sess.startTime})` : '';
            const key = `${dateKey}-class-${subj.name}-${sess.startTime || 'no-time'}`;
            tasks.push({
              key: key,
              text: `حضور حصة ${subj.name}${timeStr}`,
              done: !!autoTaskDoneStates[key],
              isAuto: true,
              source: 'auto-class',
              subjColor: subj.color,
              subjIcon: SUBJECT_ICONS[subj.name] || '⚛️'
            });
          }
        });
      }
    });
  }
  
  // 2. Study auto-tasks from studyState.subjects
  if (studyState.subjects) {
    studyState.subjects.forEach(subj => {
      if (subj.sessions) {
        subj.sessions.forEach(sess => {
          if (sess.days && sess.days.includes(dayName)) {
            const timeStr = sess.startTime ? ` (${sess.startTime})` : '';
            const key = `${dateKey}-study-${subj.name}-${sess.startTime || 'no-time'}`;
            tasks.push({
              key: key,
              text: `مذاكرة ${subj.name}${timeStr}`,
              done: !!autoTaskDoneStates[key],
              isAuto: true,
              source: 'auto-study',
              subjColor: subj.color,
              subjIcon: '📖'
            });
          }
        });
      }
    });
  }
  
  return tasks;
}

function addTodo() {
  const input = document.getElementById('todoInput');
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  
  const dateKey = dateToKey(currentSelectedDate);
  const nextId = todoItems.length ? Math.max(...todoItems.map(t => t.id)) + 1 : 1;
  
  todoItems.push({
    id: nextId,
    text: text,
    done: false,
    date: dateKey,
    createdAt: Date.now(),
    isAuto: false
  });
  
  input.value = '';
  saveCurrentData();
  renderTodoList();
  input.focus();
}

function toggleTodo(id) {
  const item = todoItems.find(t => t.id === id);
  if (item) {
    item.done = !item.done;
    saveCurrentData();
    renderTodoList();
  }
}

function toggleAutoTodo(key) {
  autoTaskDoneStates[key] = !autoTaskDoneStates[key];
  saveCurrentData();
  renderTodoList();
}

function deleteTodo(id) {
  todoItems = todoItems.filter(t => t.id !== id);
  saveCurrentData();
  renderTodoList();
}

function setTodoFilter(filter, btn) {
  todoFilter = filter;
  document.querySelectorAll('.todo-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTodoList();
}

function renderTodoList() {
  const list = document.getElementById('todoList');
  const statsEl = document.getElementById('todoStats');
  const progressBar = document.getElementById('todoProgressBar');
  if (!list) return;
  
  const dateKey = dateToKey(currentSelectedDate);
  
  // Gather tasks
  const autoTasks = getAutoTasksForDate(dateKey);
  const manualTasks = todoItems.filter(t => t.date === dateKey);
  const allTasks = [...autoTasks, ...manualTasks];
  
  // Filter
  const filtered = todoFilter === 'all' ? allTasks
    : todoFilter === 'pending' ? allTasks.filter(t => !t.done)
    : allTasks.filter(t => t.done);
    
  const done = allTasks.filter(t => t.done).length;
  const total = allTasks.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  
  statsEl.textContent = `${done} / ${total} مكتمل`;
  progressBar.style.width = pct + '%';
  
  list.innerHTML = '';
  
  if (!filtered.length) {
    let emptyIcon = '📝';
    let emptyMsg = 'لا توجد مهام مضافة لهذا اليوم. ابدأ بإضافة مهمة!';
    if (todoFilter === 'done') {
      emptyIcon = '🎉';
      emptyMsg = 'لا توجد مهام مكتملة لهذا اليوم';
    } else if (todoFilter === 'pending') {
      emptyIcon = '🎯';
      emptyMsg = 'لا توجد مهام معلقة! كل شيء تم إنجازه';
    }
    
    list.innerHTML = `<div class="todo-empty glass" style="width:100%;text-align:center;padding:40px">
      <span class="todo-empty-icon" style="font-size:3rem;display:block;margin-bottom:12px">${emptyIcon}</span>
      <div style="color:var(--text-dim)">${emptyMsg}</div>
    </div>`;
    return;
  }
  
  filtered.forEach(item => {
    const el = document.createElement('div');
    el.className = 'todo-item glass' + (item.done ? ' done' : '');
    
    const clickAction = item.isAuto 
      ? `toggleAutoTodo('${item.key}')` 
      : `toggleTodo(${item.id})`;
      
    const deleteBtn = item.isAuto 
      ? '' 
      : `<button class="todo-del-btn" onclick="deleteTodo(${item.id})">حذف</button>`;
      
    const icon = item.isAuto 
      ? `<span class="todo-item-icon" style="color:${item.subjColor || 'var(--c4)'}">${item.subjIcon}</span>` 
      : `<span class="todo-item-icon">📌</span>`;
      
    el.innerHTML = `
      <button class="todo-check" onclick="${clickAction}" title="${item.done ? 'إلغاء' : 'إتمام'}">${item.done ? '✓' : ''}</button>
      ${icon}
      <span class="todo-text">${escH(item.text)}</span>
      ${deleteBtn}
    `;
    list.appendChild(el);
  });
}

function archiveCompletedTasks() {
  const todayKey = getTodayKey();
  const toArchive = todoItems.filter(t => t.done && t.date < todayKey);
  
  if (toArchive.length === 0) {
    showToast('📂 لا توجد مهام قديمة مكتملة لأرشفتها', 'info');
    return;
  }
  
  todoArchive.push(...toArchive);
  todoItems = todoItems.filter(t => !(t.done && t.date < todayKey));
  
  saveCurrentData();
  renderTodoList();
  showToast(`✅ تم أرشفة ${toArchive.length} مهمة مكتملة`, 'success');
}

function showArchive() {
  const modal = document.getElementById('archiveModal');
  const list = document.getElementById('archiveList');
  if (!modal || !list) return;
  
  list.innerHTML = '';
  
  if (!todoArchive || !todoArchive.length) {
    list.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text-dim)">الأرشيف فارغ حالياً.</div>`;
  } else {
    const sorted = [...todoArchive].sort((a, b) => b.createdAt - a.createdAt);
    sorted.forEach(item => {
      const el = document.createElement('div');
      el.className = 'todo-item glass done';
      el.style.cssText = 'margin-bottom: 8px; justify-content: flex-start;';
      el.innerHTML = `
        <span class="todo-check" style="background:#22c55e;border-color:#22c55e;color:#fff;cursor:default;margin-left:10px">✓</span>
        <span class="todo-text" style="flex:1">${escH(item.text)}</span>
        <span style="font-size:0.75rem;color:var(--text-dim);margin-right:auto;white-space:nowrap">${item.date}</span>
      `;
      list.appendChild(el);
    });
  }
  
  modal.classList.add('visible');
}

function closeArchive() {
  const modal = document.getElementById('archiveModal');
  if (modal) modal.classList.remove('visible');
}

// Initial triggers
window.appReady.then(() => {
  initTodoPage();
});
</script>
</body>
</html>
