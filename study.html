<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول المذاكرة — منشئ الجدول الدراسي</title>
<meta name="description" content="تنظيم وإدارة جدول المذاكرة الشخصي لطلاب الثانوية العامة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4.3">
<style>
/* Page Specific Layout */
.study-page { gap: 20px; max-width: 960px; margin: 0 auto; width: 100%; padding-top: 30px; flex-direction: column; }
.notes-label {
  display: block;
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-top: 14px;
  margin-bottom: 6px;
  font-weight: 600;
}
</style>
</head>
<body>

<div class="screen active fade-in study-page" id="screenStudy" style="display: flex;">
  <div class="study-header-bar">
    <span class="study-title">📖 جدول المذاكرة الشخصي</span>
    <button class="action-btn" onclick="saveStudySchedule()">💾 حفظ</button>
  </div>
  
  <div class="study-intro glass">
    <p>أضف جلسات مذاكرتك اليومية لكل مادة. حدد الأيام والأوقات التي تخصصها للمراجعة والدراسة.</p>
    <p style="margin-top:6px" id="branchInfo">لا يوجد شعبة محددة بعد — <strong>اختر شعبتك أولاً من الجدول الدراسي</strong></p>
  </div>
  
  <div id="studyCardsGrid" class="study-grid" style="display:flex;flex-direction:column;gap:20px;width:100%;margin:15px 0;"></div>

  <div class="add-extra-subj-container" style="display:flex;justify-content:center;margin:15px 0 20px">
    <button class="action-btn" onclick="addCustomStudySubject_study()" style="background:rgba(249,115,22,.15);border-color:#f97316;color:#f97316;font-weight:700;padding:11px 24px;border-radius:30px;font-size:.9rem;cursor:pointer">
      ＋ إضافة مادة جديدة أو مدرس آخر (مثال: عربي - مدرس 2)
    </button>
  </div>
  <div class="study-build-wrap">
    <button class="study-save-btn" onclick="saveStudySchedule()">💾 حفظ جدول المذاكرة</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/particles.js"></script>
<script src="js/db.js"></script>
<script src="js/supabase.js"></script>
<script src="js/common.js?v=4.3"></script>
<script>
function initStudyPage() {
  const intro = document.getElementById('branchInfo');
  if (state.branch) {
    const br = BRANCHES[state.branch];
    if (intro) intro.innerHTML = `جدول المذاكرة لشعبة <strong>${br.label}</strong>`;
    
    // Build study subjects from branch if not loaded
    if (!studyState.subjects || !studyState.subjects.length) {
      studyState.subjects = br.subjects.map((name, i) => ({
        id: i, 
        name, 
        color: STUDY_COLORS[i % STUDY_COLORS.length],
        sessions: [mkStudySession()], 
        notes: ''
      }));
      saveCurrentData();
    }
  } else {
    if (intro) intro.innerHTML = `لم تختر شعبة بعد. <strong>اذهب إلى الجدول الدراسي أولاً واختر شعبتك</strong>`;
  }
  renderStudyCards();
}

function renderStudyCards() {
  const grid = document.getElementById('studyCardsGrid');
  grid.innerHTML = '';
  
  if (!studyState.subjects || !studyState.subjects.length) {
    grid.innerHTML = `<div class="study-intro glass" style="text-align:center;padding:40px;width:100%">
      <div style="font-size:2.5rem;margin-bottom:12px">📚</div>
      <div style="color:var(--text-dim)">اختر شعبتك أولاً من قسم الجدول الدراسي لتتمكن من تخطيط المذاكرة.</div>
    </div>`;
    return;
  }
  
  studyState.subjects.forEach((subj, si) => {
    const card = document.createElement('div');
    card.className = 'study-card glass';
    card.id = `stsc-${si}`;
    card.style.cssText = `border-right-color:${subj.color};
      box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08),0 0 20px ${subj.color}22;
      animation-delay:${si*70}ms`;
      
    let sessHTML = '';
    subj.sessions.forEach((sess, ki) => { 
      sessHTML += buildStudySessionHTML(si, ki, sess, subj.color); 
    });
    
    const isCustom = subj.isCustom || si >= (BRANCHES[state.branch]?.subjects?.length || 0);

    card.innerHTML = `
      <div class="subj-top" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px;flex:1">
          <span class="color-dot" style="background:${subj.color}"></span>
          <input type="text" value="${escH(subj.name)}" 
            onchange="updateStudySubjectName_study(${si}, this.value)" title="انقر لتعديل اسم مادة المذاكرة"
            style="background:transparent;border:none;border-bottom:1px dashed var(--glass-border);color:var(--text);font-weight:700;font-size:1.02rem;font-family:'Cairo',sans-serif;width:100%;max-width:180px;padding:2px 4px">
          <span style="font-size:.72rem;color:var(--text-dim);background:${subj.color}22;padding:3px 10px;border-radius:10px;border:1px solid ${subj.color}44">مذاكرة</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <button class="action-btn" style="padding:3px 10px;font-size:.76rem;background:${subj.color}22;border-color:${subj.color}66;color:var(--text);cursor:pointer" onclick="duplicateStudySubject_study(${si})" title="إضافة مدرس/جلسة أخرى لهذه المادة">＋ مدرس آخر</button>
          ${isCustom ? `<button class="remove-session-btn" style="position:static;padding:3px 8px;font-size:.72rem;cursor:pointer" onclick="removeStudySubject_study(${si})" title="حذف المادة">✕ حذف</button>` : ''}
        </div>
      </div>
      <div class="study-sessions-wrap" id="stSessions-${si}">${sessHTML}</div>
      <button class="add-session-btn" onclick="addStudySession(${si})">＋ إضافة جلسة مذاكرة</button>
      <label class="notes-label">📝 ملاحظات المذاكرة</label>
      <textarea class="notes-textarea" rows="2" placeholder="مثال: مراجعة الفصل الأول، حل تمارين..."
        onchange="studyState.subjects[${si}].notes=this.value">${escH(subj.notes)}</textarea>
    `;
    grid.appendChild(card);
  });
}

function duplicateStudySubject_study(si) {
  const source = studyState.subjects[si];
  const baseName = source.name.replace(/\s*\(مدرس \d+\)/, '');
  const count = studyState.subjects.filter(s => s.name.startsWith(baseName)).length + 1;
  const newName = `${baseName} (مدرس ${count})`;
  
  studyState.subjects.splice(si + 1, 0, {
    id: Date.now(),
    name: newName,
    color: source.color, // Preserves orange color for Arabic!
    sessions: [mkStudySession()],
    notes: '',
    isCustom: true
  });
  saveCurrentData();
  renderStudyCards();
}

function removeStudySubject_study(si) {
  if (confirm(`هل أنت تأكد من حذف مادة "${studyState.subjects[si].name}" من جدول المذاكرة؟`)) {
    studyState.subjects.splice(si, 1);
    saveCurrentData();
    renderStudyCards();
  }
}

function updateStudySubjectName_study(si, val) {
  if (val && val.trim()) {
    studyState.subjects[si].name = val.trim();
    saveCurrentData();
  }
}

function addCustomStudySubject_study() {
  const name = prompt('أدخل اسم مادة المذاكرة أو المدرس الجديد (مثال: عربي - مدرس 2):', 'عربي (مدرس ثاني)');
  if (!name || !name.trim()) return;
  const cleanName = name.trim();
  const isArabic = cleanName.includes('عربي');
  const color = isArabic ? '#f97316' : STUDY_COLORS[studyState.subjects.length % STUDY_COLORS.length];

  studyState.subjects.push({
    id: Date.now(),
    name: cleanName,
    color: color,
    sessions: [mkStudySession()],
    notes: '',
    isCustom: true
  });
  saveCurrentData();
  renderStudyCards();
}

function mkStudySession() {
  return { days: [], startTime: '', endTime: '', timeMode: 'quick', activeSlot: null };
}

function buildStudySessionHTML(si, ki, sess, color) {
  const daysH = DAYS.map(day => {
    const act = sess.days.includes(day);
    const st = act ? `background:${color}33;border-color:${color};color:${color};` : '';
    return `<span class="day-pill${act ? ' active' : ''}" style="${st}"
      onclick="toggleDay_study(${si},${ki},'${day}',this)">${day}</span>`;
  }).join('');
  
  const slotsH = SLOTS.map(sl => {
    const act = sess.activeSlot === sl.h;
    const st = act ? `background:${color}33;border-color:${color};color:${color};` : '';
    return `<span class="time-slot-pill${act ? ' active' : ''}" style="${st}"
      onclick="selectSlot_study(${si},${ki},${sl.h},this)">${sl.l}</span>`;
  }).join('');
  
  const mLabel = sess.timeMode === 'manual' ? 'أوقات جاهزة' : 'وقت يدوي';
  const removeBtn = ki > 0 ? `<button class="remove-session-btn" onclick="removeSession_study(${si},${ki})">✕ حذف</button>` : '';
  
  return `<div class="session-block" id="study-sb-${si}-${ki}">
    ${removeBtn}
    <div class="session-num">جلسة المذاكرة ${ki+1}</div>
    <div class="days-label">📅 أيام المذاكرة</div>
    <div class="days-pills">${daysH}</div>
    <div class="time-section">
      <div class="time-toggle-row">
        <span class="time-label-small">🕐 وقت المذاكرة:</span>
        <button class="time-mode-btn" onclick="toggleMode_study(${si},${ki},this)">${mLabel}</button>
      </div>
      <div class="time-manual" id="study-man-${si}-${ki}" ${sess.timeMode === 'manual' ? '' : 'style="display:none"'}>
        <label>من:<input type="time" class="time-input" value="${sess.startTime || ''}"
          onchange="sessField_study(${si},${ki},'startTime',this.value)"></label>
        <label>إلى:<input type="time" class="time-input" value="${sess.endTime || ''}"
          onchange="sessField_study(${si},${ki},'endTime',this.value)"></label>
      </div>
      <div class="time-slots" id="study-slt-${si}-${ki}" ${sess.timeMode === 'quick' ? '' : 'style="display:none"'}>
        ${slotsH}
      </div>
    </div>
  </div>`;
}

function addStudySession(si) {
  studyState.subjects[si].sessions.push(mkStudySession());
  const wrap = document.getElementById(`stSessions-${si}`);
  const ki = studyState.subjects[si].sessions.length - 1;
  const sess = studyState.subjects[si].sessions[ki];
  const color = studyState.subjects[si].color;
  const div = document.createElement('div');
  div.innerHTML = buildStudySessionHTML(si, ki, sess, color);
  wrap.appendChild(div.firstElementChild);
}

function removeSession_study(si, ki) {
  studyState.subjects[si].sessions.splice(ki, 1);
  const wrap = document.getElementById(`stSessions-${si}`);
  const color = studyState.subjects[si].color;
  wrap.innerHTML = studyState.subjects[si].sessions.map((s, k) => buildStudySessionHTML(si, k, s, color)).join('');
}

function toggleDay_study(si, ki, day, el) {
  const sess = studyState.subjects[si].sessions[ki];
  if (sess.days.includes(day)) {
    sess.days = sess.days.filter(d => d !== day);
    el.classList.remove('active');
    el.style = '';
  } else {
    sess.days.push(day);
    const c = studyState.subjects[si].color;
    el.classList.add('active');
    el.style.background = c + '33';
    el.style.borderColor = c;
    el.style.color = c;
  }
}

function toggleMode_study(si, ki, btn) {
  const sess = studyState.subjects[si].sessions[ki];
  const man = document.getElementById(`study-man-${si}-${ki}`);
  const slt = document.getElementById(`study-slt-${si}-${ki}`);
  if (sess.timeMode === 'quick') {
    sess.timeMode = 'manual';
    btn.textContent = 'أوقات جاهزة';
    man.style.display = 'flex';
    slt.style.display = 'none';
  } else {
    sess.timeMode = 'quick';
    btn.textContent = 'وقت يدوي';
    man.style.display = 'none';
    slt.style.display = 'flex';
  }
}

function selectSlot_study(si, ki, hour, el) {
  const sess = studyState.subjects[si].sessions[ki];
  sess.activeSlot = hour;
  sess.startTime = fromMin(hour * 60);
  sess.endTime = fromMin((hour + 1) * 60);
  const c = studyState.subjects[si].color;
  document.querySelectorAll(`#study-slt-${si}-${ki} .time-slot-pill`).forEach(p => {
    p.classList.remove('active');
    p.style = '';
  });
  el.classList.add('active');
  el.style.background = c + '33';
  el.style.borderColor = c;
  el.style.color = c;
}

function sessField_study(si, ki, field, val) {
  studyState.subjects[si].sessions[ki][field] = val;
}

function saveStudySchedule() {
  studyState.subjects.forEach((s, si) => {
    const ta = document.querySelector(`#stsc-${si} .notes-textarea`);
    if (ta) s.notes = ta.value;
  });
  saveCurrentData();
  showToast('✅ تم حفظ جدول المذاكرة', 'success');
}

// Register initialization after app is ready
window.appReady.then(() => {
  initStudyPage();
});
</script>
</body>
</html>
