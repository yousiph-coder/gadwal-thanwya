<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول السحابي — منشئ الجدول الدراسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
.oauth-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 12px 18px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #fff;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  margin-bottom: 18px;
}
.oauth-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.35);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}
.auth-divider {
  display: flex;
  align-items: center;
  margin: 16px 0;
  color: var(--text-dim, #94a3b8);
  font-size: 0.8rem;
}
.auth-divider::before, .auth-divider::after {
  content: "";
  flex: 1;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}
.auth-divider span {
  padding: 0 12px;
}
.method-pills {
  display: flex;
  background: rgba(0, 0, 0, 0.25);
  padding: 4px;
  border-radius: 10px;
  margin-bottom: 16px;
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.method-pill {
  flex: 1;
  padding: 8px;
  text-align: center;
  border: none;
  background: transparent;
  color: var(--text-dim, #94a3b8);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.method-pill.active {
  background: var(--primary, #3b82f6);
  color: #fff;
  box-shadow: 0 2px 10px rgba(59, 130, 246, 0.35);
}
.otp-container {
  display: flex;
  gap: 8px;
  direction: ltr;
  justify-content: center;
  margin: 12px 0;
}
.otp-input {
  width: 100%;
  padding: 12px;
  text-align: center;
  font-size: 1.2rem;
  letter-spacing: 4px;
  font-family: monospace;
}
</style>
</head>
<body>

<div class="screen active fade-in" id="screenAuth" style="display: flex;">
  <div class="auth-header fade-up">
    <h1>منشئ الجدول الدراسي السحابي</h1>
    <p>ثانوية عامة — قاعدة بيانات Supabase S1</p>
  </div>

  <div class="auth-box glass fade-up" style="animation-delay:.15s">
    <!-- Google OAuth Button -->
    <button class="oauth-btn" onclick="loginWithGoogle()" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>المتابعة بـ حساب Google</span>
    </button>

    <div class="auth-divider">
      <span>أو اختر طريقة الدخول السحابية</span>
    </div>

    <!-- Auth Method Tabs -->
    <div class="method-pills">
      <button class="method-pill active" id="pillEmail" onclick="switchMethod('email')">📧 بالبريد الإلكتروني</button>
      <button class="method-pill" id="pillPhone" onclick="switchMethod('phone')">📱 برقم الهاتف (SMS)</button>
    </div>

    <!-- 1. EMAIL FORM -->
    <div id="emailSection">
      <div class="auth-tabs" style="margin-bottom: 12px;">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">تسجيل الدخول</button>
        <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">حساب جديد</button>
      </div>

      <!-- LOGIN -->
      <div id="loginForm" class="auth-form">
        <div>
          <label>البريد الإلكتروني</label>
          <input type="email" class="auth-input" id="loginEmail" placeholder="example@gmail.com" autocomplete="email">
        </div>
        <div>
          <label>كلمة المرور</label>
          <input type="password" class="auth-input" id="loginPass" placeholder="أدخل كلمة المرور" autocomplete="current-password">
        </div>
        <div class="auth-error" id="loginError"></div>
        <button class="auth-btn" onclick="doLogin()">دخول سحابي ←</button>
      </div>

      <!-- REGISTER -->
      <div id="registerForm" class="auth-form" style="display:none">
        <div>
          <label>اسم المستخدم</label>
          <input type="text" class="auth-input" id="regUser" placeholder="اختر اسمك" autocomplete="username">
        </div>
        <div>
          <label>البريد الإلكتروني (للتفعيل والإشعار)</label>
          <input type="email" class="auth-input" id="regEmail" placeholder="your-email@gmail.com" autocomplete="email">
        </div>
        <div>
          <label>كلمة المرور</label>
          <input type="password" class="auth-input" id="regPass" placeholder="كلمة المرور (6 أحرف/أرقام)" autocomplete="new-password">
        </div>
        <div>
          <label>تأكيد كلمة المرور</label>
          <input type="password" class="auth-input" id="regPass2" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password">
        </div>
        <div class="auth-error" id="registerError"></div>
        <button class="auth-btn" onclick="doRegister()">إنشاء وتفعيل عبر الإيميل →</button>
      </div>
    </div>

    <!-- 2. PHONE OTP FORM -->
    <div id="phoneSection" style="display: none;" class="auth-form">
      <div id="phoneStep1">
        <div>
          <label>رقم الهاتف المحمول</label>
          <input type="tel" class="auth-input" id="phoneInput" placeholder="01012345678 أو +201012345678" dir="ltr" style="text-align: right;">
        </div>
        <div class="auth-error" id="phoneError"></div>
        <button class="auth-btn" onclick="sendPhoneCode()">إرسال رمز التفعيل SMS 📲</button>
      </div>

      <div id="phoneStep2" style="display: none;">
        <div>
          <label>رمز التحقق المرسل في رسالة SMS</label>
          <input type="text" class="auth-input otp-input" id="otpCodeInput" placeholder="123456" maxlength="6" autocomplete="one-time-code">
        </div>
        <div class="auth-error" id="otpError"></div>
        <button class="auth-btn" onclick="verifyPhoneCode()">تأكيد الرمز والدخول السحابي 🔑</button>
        <button type="button" style="background:transparent;border:none;color:var(--text-dim);margin-top:10px;width:100%;cursor:pointer;font-size:0.8rem" onclick="backToPhoneStep1()">← تعديل رقم الهاتف</button>
      </div>
    </div>
  </div>

  <div class="footer-note fade-up" id="authFooterNote" style="animation-delay:.3s">⚡ موصول بقاعدة بيانات وسحابة Supabase Auth مباشرةً</div>
</div>

<script src="js/particles.js"></script>
<script src="js/supabase.js"></script>
<script src="js/common.js?v=3.0"></script>
<script>
// Persistent Auto-Login & Google OAuth Callback Listener
document.addEventListener('DOMContentLoaded', async () => {
  if (window.initTheme) window.initTheme('math');
  if (!window.SupaDB) return;
  SupaDB.init();

  const isOAuthCallback = location.search.includes('code=') || location.hash.includes('access_token=');

  // If returning from Google OAuth, show elegant loading UI
  if (isOAuthCallback) {
    const authScreen = document.querySelector('.screen.active') || document.querySelector('.screen');
    if (authScreen) {
      authScreen.innerHTML = `
        <div style="text-align:center;padding:60px 20px;">
          <div style="font-size:3rem;margin-bottom:20px;animation:pulse 1.5s infinite">⚡</div>
          <h2 style="color:var(--accent);margin-bottom:12px;">جاري تسجيل الدخول عبر Google...</h2>
          <p style="color:var(--text-dim);font-size:0.95rem;">يتم التحقق من حسابك السحابي وتوجيهك لجدولك الدراسي فوراً</p>
        </div>
      `;
    }
  }

  if (SupaDB.client) {
    // 1. Listen for OAuth session changes
    SupaDB.client.auth.onAuthStateChange(async (event, session) => {
      if (session && session.user) {
        const res = await SupaDB.handleAuthCallback(session);
        if (res) {
          showToast('✅ تم تسجيل الدخول بـ Google بنجاح!', 'success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 300);
        }
      }
    });

    // 2. Check existing session for persistent auto-login
    try {
      const { data: { session } } = await SupaDB.client.auth.getSession();
      if (session && session.user) {
        const res = await SupaDB.handleAuthCallback(session);
        if (res) window.location.href = 'dashboard.html';
      }
    } catch(e) {
      console.warn('Session check note:', e);
    }
  }
});

function switchMethod(method) {
  document.getElementById('pillEmail').classList.toggle('active', method === 'email');
  document.getElementById('pillPhone').classList.toggle('active', method === 'phone');
  document.getElementById('emailSection').style.display = method === 'email' ? 'block' : 'none';
  document.getElementById('phoneSection').style.display = method === 'phone' ? 'flex' : 'none';
}

function switchAuthTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'flex' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'flex' : 'none';
  document.getElementById('loginError').textContent = '';
  document.getElementById('registerError').textContent = '';
}

// 1. Google OAuth
async function loginWithGoogle() {
  if (!window.SupaDB || !SupaDB.isConnected()) SupaDB.init();
  if (!SupaDB.isConnected()) {
    showToast('❌ تعذر الاتصال بـ Supabase', 'error');
    return;
  }
  const res = await SupaDB.signInWithGoogle();
  if (res.error) {
    showToast('❌ خطأ تسجيل Google: ' + res.error.message, 'error');
  }
}

// 2. Email Auth
async function doRegister() {
  const u = document.getElementById('regUser').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const p = document.getElementById('regPass').value;
  const p2 = document.getElementById('regPass2').value;
  const err = document.getElementById('registerError');

  if (!u || u.length < 3) { err.style.color = '#ef4444'; err.textContent = '⚠️ أدخل اسم المستخدم (3 أحرف على الأقل)'; return; }
  if (!email || !email.includes('@')) { err.style.color = '#ef4444'; err.textContent = '⚠️ أدخل بريد إلكتروني صحيح لرسالة التفعيل'; return; }
  if (!p || p.length < 6) { err.style.color = '#ef4444'; err.textContent = '⚠️ كلمة المرور قصيرة (6 أحرف/أرقام على الأقل)'; return; }
  if (p !== p2) { err.style.color = '#ef4444'; err.textContent = '⚠️ كلمتا المرور غير متطابقتين'; return; }

  err.style.color = '#3b82f6';
  err.textContent = '⏳ جاري الاتصال بـ Supabase وإرسال رابط التفعيل...';

  if (!window.SupaDB || !SupaDB.isConnected()) SupaDB.init();
  if (!SupaDB.isConnected()) {
    err.style.color = '#ef4444';
    err.textContent = '❌ تعذر الاتصال بالسحابة. تحقق من الإنترنت.';
    return;
  }

  const supaRes = await SupaDB.signUp(email, p, u);
  if (supaRes.error) {
    err.style.color = '#ef4444';
    if (supaRes.error.message.includes('already registered')) {
      err.textContent = '⚠️ البريد مسجل بالفعل! يمكنك تسجيل الدخول به مباشرة.';
    } else {
      err.textContent = '❌ خطأ: ' + supaRes.error.message;
    }
    return;
  }

  err.style.color = '#22c55e';
  err.innerHTML = '✉️ <strong>تم إنشاء الحساب في Supabase!</strong><br>تم إرسال رابط التفعيل إلى <strong>' + escH(email) + '</strong>.<br>افتح إيميلك واضغط على رابط التفعيل لتأكيد الدخول.';

  document.getElementById('regUser').value = '';
  document.getElementById('regEmail').value = '';
  document.getElementById('regPass').value = '';
  document.getElementById('regPass2').value = '';
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');

  if (!email || !p) { err.style.color = '#ef4444'; err.textContent = '⚠️ أدخل البريد الإلكتروني وكلمة المرور'; return; }

  err.style.color = '#3b82f6';
  err.textContent = '⏳ جاري التثبت وتسجيل الدخول عبر Supabase...';

  if (!window.SupaDB || !SupaDB.isConnected()) SupaDB.init();

  const supaRes = await SupaDB.signIn(email, p);
  if (supaRes.error) {
    err.style.color = '#ef4444';
    if (supaRes.error.message.includes('Email not confirmed')) {
      err.innerHTML = '⚠️ <strong>الإيميل غير مفعل بعد!</strong><br>افتح صندوق الوارد بإيميلك واضغط على رابط التفعيل أولاً.';
    } else if (supaRes.error.message.includes('Invalid login credentials')) {
      err.textContent = '⚠️ البريد الإلكتروني أو كلمة المرور غير صحيحة';
    } else {
      err.textContent = '❌ خطأ: ' + supaRes.error.message;
    }
    return;
  }

  if (supaRes.data?.session) {
    await SupaDB.handleAuthCallback(supaRes.data.session);
  } else {
    localStorage.setItem('tt_current_user', email);
  }

  showToast('✅ تم تسجيل الدخول سحابياً بنجاح!', 'success');
  setTimeout(() => { location.href = 'dashboard.html'; }, 500);
}

// 3. Phone OTP Auth
async function sendPhoneCode() {
  const rawPhone = document.getElementById('phoneInput').value.trim();
  const err = document.getElementById('phoneError');

  if (!rawPhone || rawPhone.length < 8) {
    err.style.color = '#ef4444';
    err.textContent = '⚠️ أدخل رقم هاتف صحيح';
    return;
  }

  err.style.color = '#3b82f6';
  err.textContent = '⏳ جاري إرسال رمز التفعيل عبر SMS...';

  if (!window.SupaDB || !SupaDB.isConnected()) SupaDB.init();

  const res = await SupaDB.sendPhoneOTP(rawPhone);
  if (res.error) {
    err.style.color = '#ef4444';
    err.textContent = '❌ خطأ إرسال SMS: ' + res.error.message;
    return;
  }

  currentPhoneFormatted = res.phone;
  err.textContent = '';
  document.getElementById('phoneStep1').style.display = 'none';
  document.getElementById('phoneStep2').style.display = 'block';
  showToast('📲 تم إرسال رمز التفعيل إلى هاتفك!', 'info');
}

async function verifyPhoneCode() {
  const code = document.getElementById('otpCodeInput').value.trim();
  const err = document.getElementById('otpError');

  if (!code || code.length < 6) {
    err.style.color = '#ef4444';
    err.textContent = '⚠️ أدخل رمز التفعيل المكون من 6 أرقام';
    return;
  }

  err.style.color = '#3b82f6';
  err.textContent = '⏳ جاري التحقق من الرمز ودخول الحساب...';

  const res = await SupaDB.verifyPhoneOTP(currentPhoneFormatted, code);
  if (res.error) {
    err.style.color = '#ef4444';
    err.textContent = '❌ رمز التفعيل غير صحيح أو منتهي الصلاحية';
    return;
  }

  const sessionUser = res.data?.user;
  const username = 'phone_' + currentPhoneFormatted.replace(/[^0-9]/g, '').slice(-6);

  localStorage.setItem('tt_current_user', username);
  if (sessionUser?.id) localStorage.setItem('tt_supabase_uid', sessionUser.id);

  showToast('✅ تم التفعيل وتسجيل الدخول بنجاح!', 'success');
  setTimeout(() => { location.href = 'dashboard.html'; }, 500);
}

function backToPhoneStep1() {
  document.getElementById('phoneStep1').style.display = 'block';
  document.getElementById('phoneStep2').style.display = 'none';
}
</script>
</body>
</html>
